{% extends "base.html" %}
{% block title %}{{ t.get("staff-login-title") }}{% endblock %}
{% block content %}
<h1>{{ t.get("staff-login-title") }}</h1>
{% if let Some(key) = error %}
<p class="error" role="alert">{{ t.get(key) }}</p>
{% endif %}
<form class="login" action="/equipe/login" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="login">{{ t.get("staff-login-user") }}</label>
  <input id="login" name="login" autocomplete="username" required value="{{ login }}">
  <label for="password">{{ t.get("staff-login-password") }}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">{{ t.get("staff-login-submit") }}</button>
</form>
{% endblock %}
