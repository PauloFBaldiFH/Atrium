[package]
name = "elzevir"
description = "Elzevir library system: one binary with serve, import, worker and panel roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
elzevir-app.workspace = true
elzevir-store.workspace = true
elzevir-web.workspace = true
elzevir-sip2.workspace = true
elzevir-web-templates.workspace = true
axum.workspace = true
clap.workspace = true
mimalloc.workspace = true
stats_alloc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }

[dev-dependencies]
elzevir-domain.workspace = true
elzevir-marc.workspace = true
elzevir-search.workspace = true
tempfile.workspace = true

[features]
# Counts every allocation (small overhead); shown at /equipe/admin/memory.
alloc-count = ["dep:stats_alloc"]

[lints]
workspace = true
