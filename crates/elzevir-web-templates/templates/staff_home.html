{% extends "base.html" %}
{% block title %}{{ t.get("staff-home-title") }}{% endblock %}
{% block content %}
<h1>{{ t.get("staff-home-title") }}</h1>
<p>{{ t.get("staff-home-signed-in-as") }} <strong id="signed-in-as">{{ login }}</strong></p>
{% if is_admin %}
<p><a href="/equipe/admin">{{ t.get("staff-home-administration") }}</a></p>
{% endif %}
<form action="/equipe/logout" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button type="submit">{{ t.get("staff-home-logout") }}</button>
</form>
{% endblock %}
