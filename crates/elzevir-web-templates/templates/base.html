<!doctype html>
<html lang="{{ t.lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ t.get("app-name") }}</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/elzevir.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ t.get("app-name") }}</a>
    <nav>
      <a href="/">{{ t.get("nav-catalog") }}</a>
      <a href="/equipe">{{ t.get("nav-staff") }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
