[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/PauloFBaldiFH/Atrium"
publish = false

[workspace.dependencies]
atrium-app = { path = "crates/atrium-app" }
atrium-data = { path = "crates/atrium-data" }
atrium-domain = { path = "crates/atrium-domain" }
atrium-marc = { path = "crates/atrium-marc" }
atrium-sip2 = { path = "crates/atrium-sip2" }
atrium-store = { path = "crates/atrium-store" }
atrium-web = { path = "crates/atrium-web" }
atrium-web-templates = { path = "crates/atrium-web-templates" }

argon2 = "0.6"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query", "json"] }
clap = { version = "4", features = ["derive"] }
fluent-bundle = "0.16"
getrandom = "0.4"
mimalloc = { version = "0.1", default-features = false }
stats_alloc = "0.1"
http-body-util = "0.1"
proptest = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
unic-langid = { version = "0.9", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not abort a request (CLAUDE.md, "Erros").
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
dbg_macro = "deny"
print_stderr = "deny"
float_arithmetic = "deny"
# Every `#[allow]` / `#[expect]` must say why.
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
undocumented_unsafe_blocks = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
self_named_module_files = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
