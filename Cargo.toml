[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/PauloFBaldiFH/Elzevir"
publish = false

[workspace.dependencies]
elzevir-app = { path = "crates/elzevir-app" }
elzevir-data = { path = "crates/elzevir-data" }
elzevir-domain = { path = "crates/elzevir-domain" }
elzevir-marc = { path = "crates/elzevir-marc" }
elzevir-scenarios = { path = "crates/elzevir-scenarios" }
elzevir-search = { path = "crates/elzevir-search" }
elzevir-sip2 = { path = "crates/elzevir-sip2" }
elzevir-store = { path = "crates/elzevir-store" }
elzevir-web = { path = "crates/elzevir-web" }
elzevir-web-templates = { path = "crates/elzevir-web-templates" }

argon2 = "0.6"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query", "json"] }
clap = { version = "4", features = ["derive"] }
fluent-bundle = "0.16"
getrandom = "0.4"
mimalloc = { version = "0.1", default-features = false }
stats_alloc = "0.1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "stemmer"] }
http-body-util = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
insta = { version = "1", default-features = false, features = ["yaml"] }
proptest = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
unic-langid = { version = "0.9", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not abort a request (CLAUDE.md, "Erros").
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
dbg_macro = "deny"
print_stderr = "deny"
float_arithmetic = "deny"
# Every `#[allow]` / `#[expect]` must say why.
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
undocumented_unsafe_blocks = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
self_named_module_files = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
