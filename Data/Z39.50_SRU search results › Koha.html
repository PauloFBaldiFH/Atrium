    (function() {

            var date_pattern = 'YYYY-MM-DD';
            if(format == 'us') date_pattern = 'MM/DD/YYYY';

            if(format == 'dmydot') date_pattern = 'DD.MM.YYYY';

        };

            return time_pattern;
        };

         * A JS equivalent of the KohaDates TT Plugin. Passed an rfc3339 formatted date string,
         * or JS Date, the function will return a date string formatted as per the koha instance config.
         * @param {String|Date} value                   rfc3339 formatted date string or a JS Date object.
         * @param {Object} [options]                    Optional set of switches for changing date handling
         * @property {String} [options.tz]              String representing the timezone of the passed date
         * @property {Boolean} [options.no_tz_adjust]   Enable/Disable timezone adjustment
         * @property {String} [options.dateformat]
         * @property {Boolean} [options.withtime]       Enable/Disable appearance of time in returned string
         * @property {String} [options.timeformat]

        window.$date = function(value, options) {

            var m = dayjs(value);
            if ( !no_tz_adjust && ! value.match(/^\d{4}-\d{2}-\d{2}$/ ) ) {
                m = m.tz(tz);
            }

            var dateformat = (options&&options.dateformat)||def_date_format;
            var withtime = (options&&options.withtime)||false;

            if(dateformat=='rfc3339' && withtime) return m.format();

            var timeformat = (options&&options.timeformat)||def_time_format;
            var date_pattern = get_date_pattern(dateformat);
            let as_due_date = (options&&options.as_due_date);
            if (as_due_date) {
                withtime = !( m.hour() == 23 && m.minute() == 59 );
            }
            var time_pattern = !withtime?'':' '+get_time_pattern(timeformat);

            return m.format(date_pattern+time_pattern);
        }

        window.$datetime = function(value, options) {
            options = options||{};
            options.withtime = true;
            return $date(value, options);
        };

        window.$time = function(value, options) {
            if(!value) return '';
            var tz = (options&&options.tz)||def_tz;
            var m = dayjs(value);
            if(tz) m = m.tz(tz);

            var dateformat = (options&&options.dateformat);
            var timeformat = (dateformat=='rfc3339'&&'24hr')||(options&&options.timeformat)||def_time_format;

            var intime = value.split(':');

                hours = ( hours > 12 ) ? ( hours - 12 ) : hours;

                return hours.toString().padStart(2,'0') + ':' + minutes.toString().padStart(2,'0') + " " + ampm;

            }

<script nonce="">
    (function() {

        const tz = 'America/Sao_Paulo';
        window.$get_age = function(dob, options) {
            if(!dob) return '';

            let today = new Date();
            dob = new Date(dob);
            if ( tz ) {
                let today_tz = new Date(today.toLocaleString('en-US', {timeZone: tz}));
                let diff = today.getTime() - today_tz.getTime();
                today = new Date(today.getTime() - diff);

                let dob_tz = new Date(dob.toLocaleString('en-US', {timeZone: tz}));
                diff = dob.getTime() - dob_tz.getTime();
                dob = new Date(dob.getTime() - diff);
            }
            let age = today.getFullYear() - dob.getFullYear();
            let m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            return age;
        }

    })();
</script>

        (function () {
            function getURLParams() {
                const params = new URLSearchParams(window.location.search);
                return params;
            }

            function toggleURLParams(paramsToToggle) {
                const url = new URL(window.location.href);
                const params = url.searchParams;

                // Check if all params are currently set
                const allSet = paramsToToggle.every(param => params.get(param) === "yes");

                if (allSet) {
                    // Remove all params
                    paramsToToggle.forEach(param => params.delete(param));
                } else {
                    // Add all params
                    paramsToToggle.forEach(param => params.set(param, "yes"));
                }

                window.location.href = url.toString();
            }

            function updateButtonText() {
                const params = getURLParams();

                // User CSS button
                const cssDisabled = params.get("DISABLE_SYSPREF_IntranetUserCSS") === "yes" && params.get("DISABLE_SYSPREF_OPACUserCSS") === "yes";
                const cssToggle = document.getElementById("toggleUserCSS");
                if (cssToggle) {
                    const cssText = cssToggle.querySelector(".toggle-text");
                    if (cssText) cssText.textContent = cssDisabled ? _("Enable custom CSS") : _("Disable custom CSS");
                }

                // User JS button
                const jsDisabled = params.get("DISABLE_SYSPREF_IntranetUserJS") === "yes" && params.get("DISABLE_SYSPREF_OPACUserJS") === "yes";
