name: Fuzz

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "3600"

permissions:
  contents: read

jobs:
  iso2709:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the ISO 2709 reader
        working-directory: fuzz
        run: cargo +nightly fuzz run iso2709 -- -max_total_time=${{ inputs.seconds || 3600 }} -rss_limit_mb=512
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
